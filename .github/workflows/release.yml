# Builds the friend packages (tools/package.py) on Windows and macOS and
# attaches them to the GitHub release. Publishing a release is all it takes:
#   gh release create v0.5.0 --title "Forever Tracker 0.5.0" --notes "..."
# "Run workflow" on the Actions tab builds them without a release (artifacts).
name: Build friend packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            deps: pyinstaller pillow
            app: build/exe/ForeverTrackerCompanion.exe
            files: dist/ForeverTracker.zip dist/ForeverTracker-[0-9]*.zip
          - os: macos-14   # Apple Silicon
            deps: pyinstaller pyobjc-framework-Quartz
            app: build/exe/ForeverTrackerCompanion.app/Contents/MacOS/ForeverTrackerCompanion
            files: dist/ForeverTracker-mac*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ${{ matrix.deps }}
      - run: python tools/package.py
      - name: Self-test the packaged app
        run: ${{ matrix.app }} --selftest
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.files }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: forever-tracker-${{ matrix.os }}
          path: dist/*.zip
